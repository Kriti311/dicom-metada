{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center ">
    <div class="card shadow-lg p-4 border-0" style="max-width: 500px;">
        <div class="card-body text-center">
            <h2 class="text-danger fw-bold">Confirm Deletion</h2>
            <p class="mt-3 text-muted">
                Are you sure you want to delete <strong class="text-dark">{{ dicom_file.patient_id }}</strong>?
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'dicom:list' %}" class="btn btn-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
